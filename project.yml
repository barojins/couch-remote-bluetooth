name: CouchRemote
options:
  bundleIdPrefix: com.couchremote
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    COUCH_REMOTE_BUNDLE_PREFIX: com.couchremote
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  CouchRemoteMac:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: application
    platform: macOS
    sources: [Shared, MacRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COUCH_REMOTE_BUNDLE_PREFIX).mac
        PRODUCT_NAME: CouchRemoteMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your iPhone to receive trackpad and keyboard commands.
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  CouchRemotePhone:
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    type: application
    platform: iOS
    sources: [Shared, PhoneRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COUCH_REMOTE_BUNDLE_PREFIX).phone
        PRODUCT_NAME: CouchRemotePhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couch Remote
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your Mac to use your iPhone as a trackpad and keyboard.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
schemes:
  CouchRemoteMac:
    build:
      targets:
        CouchRemoteMac: all
  CouchRemotePhone:
    build:
      targets:
        CouchRemotePhone: all
